# ============================================================
# Уведомление о падении любого workflow
# ============================================================
name: "Failure Alert"

on:
  workflow_run:
    workflows: ["Next.js CI/CD", "React Vite CI/CD", "Python Bot CI/CD"]
    types:
      - completed

jobs:
  notify-failure:
    name: "Alert on Failure"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Send Failure Alert
        run: |
          WORKFLOW="${{ github.event.workflow_run.name }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          ACTOR="${{ github.event.workflow_run.actor.login }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.event.workflow_run.id }}"

          MSG="🔴 *CI/CD FAILED*%0A%0A"
          MSG+="📦 \`${REPO}\`%0A"
          MSG+="⚙️ ${WORKFLOW}%0A"
          MSG+="🌿 Branch: \`${BRANCH}\`%0A"
          MSG+="👤 ${ACTOR}%0A"
          MSG+="🔗 [Посмотреть логи](${RUN_URL})"

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"
